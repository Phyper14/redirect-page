name: Publicar site e criar links

on:
  push:
    branches: [main]
    paths: [site/**, scripts/**, .github/workflows/pages.yml]
  workflow_dispatch:
    inputs:
      coupon:
        description: Cupom (deixe vazio só para republicar)
        required: false
      url:
        description: URL de destino (opcional, abre depois de copiar)
        required: false
      slug:
        description: Slug personalizado (opcional)
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar link
        id: add
        if: ${{ inputs.coupon != '' }}
        env:
          COUPON: ${{ inputs.coupon }}
          URL: ${{ inputs.url }}
          SLUG: ${{ inputs.slug }}
        run: node scripts/add-link.mjs

      - name: Commit do novo link
        if: ${{ inputs.coupon != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/links.json
          git commit -m "Adiciona link ${{ steps.add.outputs.slug }}"
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Montar site
        run: |
          mkdir _site && cp -r site/. _site/
          sed -i "s|__BASE__|${{ steps.pages.outputs.base_path }}|g" _site/index.html
          cp _site/index.html _site/404.html   # o Pages serve o 404.html para /slug

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Link curto criado
        if: ${{ inputs.coupon != '' }}
        run: |
          echo "### Link: ${{ steps.pages.outputs.base_url }}/${{ steps.add.outputs.slug }}" >> "$GITHUB_STEP_SUMMARY"
