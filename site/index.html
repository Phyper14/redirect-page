<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Seu cupom de desconto</title>
<style>
:root{--red:#e11d12;--orange:#f2681c;--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--text:#f5f5f5;--muted:#b3b3b3;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(120% 60% at 50% -10%,var(--red) 0,var(--orange) 35%,transparent 70%),var(--bg)}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px #000a}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:0 0 6px}
h1{margin:0;font-size:22px;line-height:1.25}
.discount{margin:18px 0 4px;font-size:56px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--red),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--muted);font-size:14px}
.code{margin:20px 0 14px;font:700 26px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;border:2px dashed var(--orange);border-radius:12px;padding:14px 10px;word-break:break-all;user-select:all}
button,.go{display:block;width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:12px;color:#fff;cursor:pointer;text-decoration:none;font-family:inherit}
button{background:var(--orange);color:#0a0a0a;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;transition:background-color .2s,transform .1s}
button:hover{background:#ff7a2e}button:active{transform:scale(.98)}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.ok{background:var(--ok);color:#04210f}
button:focus-visible,.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.go{margin-top:10px;background:transparent;border:1px solid #404040;font-weight:600;font-size:15px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background-color .2s}
.go:hover{background:#1f1f1f}
.status{min-height:20px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.trust{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.trust b{color:var(--text)}
.terms{margin:12px 0 0;font-size:13px;color:#a3a3a3;line-height:1.5;text-align:left}
.warn{margin:14px 0 0;padding:10px;border-radius:10px;background:#3b1a14;color:#fecaca;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.skel{height:56px;border-radius:12px;background:#1f1f1f;margin:20px 0 14px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
[hidden]{display:none!important}
</style></head><body><main>
<p class="eyebrow" id="eyebrow" hidden></p>
<h1 id="title">Encurtador de cupons</h1>
<div id="discount" class="discount" hidden></div>
<p class="sub" id="sub">Use um link curto para receber seu cupom.</p>
<div class="skel" id="skel" aria-hidden="true" hidden></div>
<div class="code" id="code" hidden></div>
<div class="warn" id="warn" hidden></div>
<button id="btn" type="button" hidden><svg id="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span id="lbl">Copiar cupom</span></button>
<a class="go" id="go" hidden rel="noopener noreferrer"><span id="goLbl">Abrir a loja</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
<p class="status" id="msg" role="status" aria-live="polite"></p>
<div class="trust" id="trust" hidden></div>
<p class="terms" id="terms" hidden></p>
</main>
<script>
// Contagem anônima (GoatCounter, sem cookies). O formato ?c=slug conta como /slug e os demais
// parâmetros (ex.: ttclid do TikTok) são descartados, senão cada clique vira um caminho diferente.
window.goatcounter = { path: p => { const c = new URLSearchParams(location.search).get("c"); return c ? "/" + c : p.split("?")[0]; } };
</script>
<script data-goatcounter="https://pablomartins-dafiti.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// __BASE__ é substituído no deploy (caminho do site, ex.: "/meu-repo" ou "").
const RAW = "__BASE__";
const BASE = RAW.startsWith("__") ? "" : RAW;
const $ = id => document.getElementById(id);
const show = (id, text) => { if (text == null || text === "") return; $(id).textContent = text; $(id).hidden = false; };

function getSlug() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q;
  let p = decodeURIComponent(location.pathname);
  if (BASE && p.startsWith(BASE)) p = p.slice(BASE.length);
  p = p.replace(/^\/+|\/+$/g, "");
  return p === "index.html" || p === "404.html" ? "" : p;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove();
    if (!ok) throw new Error("falhou");
  }
}

// O count.js é assíncrono: espera até ~1,2 s (menos que o redirecionamento) e desiste em silêncio se estiver bloqueado.
function track(ev) {
  const send = () => { try { window.goatcounter.count(ev); } catch {} };
  if (typeof window.goatcounter?.count === "function") return send();
  let n = 0;
  const t = setInterval(() => {
    if (typeof window.goatcounter?.count === "function") { clearInterval(t); send(); }
    else if (++n >= 12) clearInterval(t);
  }, 100);
}

// Só segue destinos http(s); qualquer outra coisa (javascript:, data:) é ignorada.
function safeUrl(u) {
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch { return null; }
}

(async () => {
  const slug = getSlug();
  if (!slug) return;
  $("skel").hidden = false;
  let link;
  try { link = (await (await fetch(BASE + "/links.json", { cache: "no-store" })).json())[slug]; } catch {}
  $("skel").hidden = true;
  if (!link) { $("title").textContent = "Link não encontrado"; $("sub").textContent = "Esse link não existe ou foi removido."; return; }

  const { coupon, title, discount, store, by, terms, expires } = link;
  const dest = link.url ? safeUrl(link.url) : null;
  const expired = expires && new Date(expires + "T23:59:59-03:00") < new Date();

  document.title = discount ? `${discount} — cupom ${coupon}` : "Seu cupom de desconto";
  show("eyebrow", title); $("title").textContent = store ? `Cupom ${store}` : "Seu cupom";
  show("discount", discount);
  $("sub").textContent = by ? `Cupom de ${by}` : "Copie e cole no checkout";
  show("code", coupon); $("btn").hidden = false;
  show("terms", terms);
  if (dest) {
    $("go").href = dest.href; $("go").hidden = false;
    $("trust").hidden = false;
    $("trust").replaceChildren(
      "Você será levado para ", Object.assign(document.createElement("b"), { textContent: dest.hostname }),
      ". Esta página só copia o cupom: não pedimos dados, login nem pagamento. Contamos visitas de forma anônima, sem cookies."
    );
  }
  if (expired) show("warn", "Atenção: esta promoção pode ter encerrado. Confira as condições na loja.");

  const goes = dest && !expired;
  $("lbl").textContent = goes ? "Copiar cupom e ir para a loja" : "Copiar cupom";
  if (dest) $("goLbl").textContent = "Abrir a loja sem copiar";

  // A cópia só acontece no toque: o navegador não pede permissão e funciona em apps com navegador interno.
  let busy = false;
  $("btn").onclick = async () => {
    if (busy) return;
    busy = true;
    // Funil por link: toque -> copiado (ou falha). Mostra se as pessoas nem tocam ou se a cópia falha.
    track({ event: true, path: "toque/" + slug, title: "Toque no botão" });
    try {
      await copy(coupon);
      // Evento "cupom copiado" por link; ignorado se o contador estiver bloqueado.
      track({ event: true, path: "copiado/" + slug, title: "Cupom copiado" });
      $("lbl").textContent = "Cupom copiado!"; $("btn").className = "ok";
      const check = document.createElementNS("http://www.w3.org/2000/svg", "path");
      check.setAttribute("d", "M20 6 9 17l-5-5");
      $("ico").replaceChildren(check);
      $("msg").textContent = goes ? `Abrindo ${dest.hostname}…` : "Cole o cupom no checkout.";
      // ~1,2 s: tempo de o evento sair antes de trocar de página.
      if (goes) setTimeout(() => location.assign(dest.href), 1200);
    } catch {
      busy = false;
      track({ event: true, path: "falha/" + slug, title: "Falha ao copiar" });
      $("msg").textContent = "Não foi possível copiar. Toque no cupom acima, copie e depois abra a loja.";
    }
  };
})();
</script></body></html>
