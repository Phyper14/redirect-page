<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Seu cupom de desconto</title>
<style>
:root{--red:#e11d12;--orange:#f2681c;--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--text:#f5f5f5;--muted:#a3a3a3;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(120% 60% at 50% -10%,var(--red) 0,var(--orange) 35%,transparent 70%),var(--bg)}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px #000a}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:0 0 6px}
h1{margin:0;font-size:22px;line-height:1.25}
.discount{margin:18px 0 4px;font-size:56px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--red),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--muted);font-size:14px}
.code{margin:20px 0 14px;font:700 26px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;border:2px dashed var(--orange);border-radius:12px;padding:14px 10px;word-break:break-all;user-select:all}
button,.go{display:block;width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:12px;color:#fff;cursor:pointer;text-decoration:none;font-family:inherit}
button{background:linear-gradient(90deg,var(--red),var(--orange))}
button.ok{background:var(--ok);color:#04210f}
button:focus-visible,.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.go{margin-top:10px;background:transparent;border:1px solid var(--line);font-weight:600;font-size:15px}
.status{min-height:20px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.trust{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.trust b{color:var(--text)}
.terms{margin:10px 0 0;font-size:12px;color:#737373;line-height:1.5;text-align:left}
.warn{margin:14px 0 0;padding:10px;border-radius:10px;background:#3b1a14;color:#fecaca;font-size:14px}
[hidden]{display:none!important}
</style></head><body><main>
<p class="eyebrow" id="eyebrow" hidden></p>
<h1 id="title">Encurtador de cupons</h1>
<div id="discount" class="discount" hidden></div>
<p class="sub" id="sub">Use um link curto para receber seu cupom.</p>
<div class="code" id="code" hidden></div>
<div class="warn" id="warn" hidden></div>
<button id="btn" hidden>Copiar cupom</button>
<a class="go" id="go" hidden rel="noopener noreferrer">Ir para a loja agora</a>
<p class="status" id="msg" role="status" aria-live="polite"></p>
<div class="trust" id="trust" hidden></div>
<p class="terms" id="terms" hidden></p>
</main>
<script>
// __BASE__ é substituído no deploy (caminho do site, ex.: "/meu-repo" ou "").
const RAW = "__BASE__";
const BASE = RAW.startsWith("__") ? "" : RAW;
const $ = id => document.getElementById(id);
const show = (id, text) => { if (text == null || text === "") return; $(id).textContent = text; $(id).hidden = false; };

function getSlug() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q;
  let p = decodeURIComponent(location.pathname);
  if (BASE && p.startsWith(BASE)) p = p.slice(BASE.length);
  p = p.replace(/^\/+|\/+$/g, "");
  return p === "index.html" || p === "404.html" ? "" : p;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove();
    if (!ok) throw new Error("falhou");
  }
}

// Só segue destinos http(s); qualquer outra coisa (javascript:, data:) é ignorada.
function safeUrl(u) {
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch { return null; }
}

(async () => {
  const slug = getSlug();
  if (!slug) return;
  let link;
  try { link = (await (await fetch(BASE + "/links.json", { cache: "no-store" })).json())[slug]; } catch {}
  if (!link) { $("title").textContent = "Link não encontrado"; $("sub").textContent = "Esse link não existe ou foi removido."; return; }

  const { coupon, title, discount, store, by, terms, expires } = link;
  const dest = link.url ? safeUrl(link.url) : null;
  const expired = expires && new Date(expires + "T23:59:59-03:00") < new Date();

  document.title = discount ? `${discount} — cupom ${coupon}` : "Seu cupom de desconto";
  show("eyebrow", title); $("title").textContent = store ? `Cupom ${store}` : "Seu cupom";
  show("discount", discount);
  $("sub").textContent = by ? `Cupom de ${by}` : "Copie e cole no checkout";
  show("code", coupon); $("btn").hidden = false;
  show("terms", terms);
  if (dest) {
    $("go").href = dest.href; $("go").hidden = false;
    $("trust").hidden = false;
    $("trust").replaceChildren(
      "Você será levado para ", Object.assign(document.createElement("b"), { textContent: dest.hostname }),
      ". Esta página só copia o cupom: não pedimos dados, login nem pagamento."
    );
  }
  if (expired) show("warn", "Atenção: esta promoção pode ter encerrado. Confira as condições na loja.");

  let done = false;
  async function run() {
    try {
      await copy(coupon); done = true;
      $("btn").textContent = "✓ Cupom copiado!"; $("btn").className = "ok";
      $("msg").textContent = dest && !expired ? `Abrindo ${dest.hostname}…` : "Cole o cupom no checkout.";
      if (dest && !expired) setTimeout(() => location.assign(dest.href), 1500);
    } catch { $("msg").textContent = "Toque em “Copiar cupom” para copiar."; }
  }
  $("btn").onclick = run;
  run(); // tenta copiar sozinho; alguns navegadores exigem o toque
})();
</script></body></html>
