<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Seu cupom</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f4f5f7;color:#1c1e21}
main{background:#fff;padding:32px 24px;border-radius:16px;box-shadow:0 4px 24px #0001;max-width:360px;width:calc(100% - 32px);text-align:center}
.code{font:700 28px ui-monospace,monospace;letter-spacing:2px;border:2px dashed #888;border-radius:10px;padding:14px;margin:16px 0;word-break:break-all}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:#1a73e8;color:#fff;cursor:pointer}
button.ok{background:#188038}p{color:#555;font-size:14px}[hidden]{display:none}
</style></head><body><main>
<h1 id="title">🎟️ Seu cupom</h1>
<div class="code" id="code" hidden></div>
<button id="btn" hidden>Copiar cupom</button>
<p id="msg"></p></main>
<script>
// __BASE__ é substituído no deploy (caminho do site, ex.: "/meu-repo" ou "").
const RAW = "__BASE__";
const BASE = RAW.startsWith("__") ? "" : RAW;
const $ = id => document.getElementById(id);

function getSlug() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q;
  let p = decodeURIComponent(location.pathname);
  if (BASE && p.startsWith(BASE)) p = p.slice(BASE.length);
  p = p.replace(/^\/+|\/+$/g, "");
  return p === "index.html" || p === "404.html" ? "" : p;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove();
    if (!ok) throw new Error("falhou");
  }
}

(async () => {
  const slug = getSlug();
  if (!slug) { $("title").textContent = "🎟️ Encurtador de cupons"; $("msg").textContent = "Use um link curto para receber seu cupom."; return; }
  let link;
  try { link = (await (await fetch(BASE + "/links.json", { cache: "no-store" })).json())[slug]; } catch {}
  if (!link) { $("title").textContent = "Link não encontrado"; $("msg").textContent = "Esse link não existe ou foi removido."; return; }

  const { coupon, url } = link;
  $("code").textContent = coupon; $("code").hidden = false; $("btn").hidden = false;
  let done = false;
  async function run() {
    try {
      await copy(coupon); done = true;
      $("btn").textContent = "✓ Cupom copiado!"; $("btn").className = "ok";
      $("msg").textContent = url ? "Redirecionando para a loja…" : "Cole o cupom no checkout.";
      if (url) setTimeout(() => (location.href = url), 1200);
    } catch { $("msg").textContent = "Toque no botão para copiar o cupom."; }
  }
  $("btn").onclick = () => (done && url ? (location.href = url) : run());
  run(); // tenta copiar sozinho; alguns navegadores exigem o toque
})();
</script></body></html>
